[project]
name = "quill"
version = "0.1.0"
description = "A terminal-only, TUI note taking tool with Markdown, wiki-links, and optional AI assistance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
quill = "quill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quill"]
